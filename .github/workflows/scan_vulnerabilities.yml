name: "scan-vulnerabilities"

on:
  schedule:
    - cron: "0 23 * * 0"    # Sunday 23:00 UTC — before Monday's version bumpers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: "Scan ${{ matrix.variant }} image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: src/Dockerfile
          - variant: alpine
            dockerfile: src/Dockerfile-alpine
          - variant: ubuntu
            dockerfile: src/Dockerfile-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build ${{ matrix.variant }} image for scanning
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: src
          file: ${{ matrix.dockerfile }}
          push: false
          tags: scan-target:${{ matrix.variant }}

      - name: Scan ${{ matrix.variant }} image (JSON)
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:${{ matrix.variant }}
          trivyignores: .trivyignore
          format: json
          output: trivy-${{ matrix.variant }}.json
          exit-code: 0

      - name: Scan ${{ matrix.variant }} image (SARIF)
        if: always()
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:${{ matrix.variant }}
          trivyignores: .trivyignore
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          exit-code: 0

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      - name: Upload JSON artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trivy-${{ matrix.variant }}
          path: trivy-${{ matrix.variant }}.json
          retention-days: 7

  triage:
    name: "Triage CVEs and create/update GitHub Issues"
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trivy-*
          merge-multiple: true

      - name: Triage CVEs and create/update issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date +%Y-%m-%d)

          # A variant whose scan failed has no JSON, or an incomplete one, and "not detected"
          # would then mean "not scanned": close nothing, but still triage what was scanned.
          SCANNED=""
          MISSING=false
          for VARIANT in debian alpine ubuntu; do
            if jq -e .SchemaVersion "trivy-${VARIANT}.json" > /dev/null 2>&1; then
              SCANNED="${SCANNED} ${VARIANT}"
            else
              echo "::error::trivy-${VARIANT}.json is missing or incomplete (the ${VARIANT} scan failed); not closing any issue or PR."
              MISSING=true
            fi
          done

          # Collect all unique CRITICAL/HIGH CVE IDs across all three images using jq
          ALL_CVES=$(for VARIANT in $SCANNED; do
            jq -r '.Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL" or .Severity == "HIGH") |
              .VulnerabilityID' "trivy-${VARIANT}.json"
          done | sort -u)

          # Get open issues and PRs — needed for cleanup regardless of current CVE state
          OPEN_ISSUES=$(gh issue list --repo "$REPO" --label security \
            --state open --json number,title --limit 100 2>/dev/null || echo "[]")
          OPEN_PRS=$(gh pr list --repo "$REPO" --label security \
            --state open --json number,body --limit 100 2>/dev/null || echo "[]")

          if ! $MISSING; then
            # Close issues for CVEs no longer detected
            echo "$OPEN_ISSUES" | jq -r '.[].title' | grep -oE 'CVE-[0-9]+-[0-9]+' | sort -u | \
            while read -r CVE_ID; do
              [ -z "$CVE_ID" ] && continue
              echo "$ALL_CVES" | grep -qx "$CVE_ID" && continue
              ISSUE_NUM=$(echo "$OPEN_ISSUES" | jq -r --arg cve "$CVE_ID" \
                '.[] | select(.title | contains($cve)) | .number' | head -1)
              if [ -n "$ISSUE_NUM" ]; then
                gh issue close "$ISSUE_NUM" --repo "$REPO" \
                  --comment "Resolved — ${CVE_ID} no longer detected in weekly scan (${TODAY})."
              fi
            done

            # Close auto-fix PRs where all CVEs in the PR body are resolved
            echo "$OPEN_PRS" | jq -c '.[]' | while read -r PR_JSON; do
              PR_NUM=$(echo "$PR_JSON" | jq -r '.number')
              PR_BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
              PR_CVES=$(echo "$PR_BODY" | grep -oE 'CVE-[0-9]+-[0-9]+' | sort -u)
              [ -z "$PR_CVES" ] && continue
              ALL_RESOLVED=true
              while read -r PR_CVE; do
                [ -z "$PR_CVE" ] && continue
                echo "$ALL_CVES" | grep -qx "$PR_CVE" && { ALL_RESOLVED=false; break; }
              done <<< "$PR_CVES"
              if [ "$ALL_RESOLVED" = true ]; then
                gh pr close "$PR_NUM" --repo "$REPO" \
                  --comment "All CVEs in this PR are resolved — closing automatically (${TODAY})."
              fi
            done
          fi

          if [ -z "$ALL_CVES" ]; then
            echo "No CRITICAL/HIGH CVEs found across all images."
            exit 0
          fi

          # Refresh open issues list after potential closes above
          OPEN_ISSUES=$(gh issue list --repo "$REPO" --label security \
            --state open --json number,title --limit 100 2>/dev/null || echo "[]")

          echo "$ALL_CVES" | while read -r CVE_ID; do
            [ -z "$CVE_ID" ] && continue

            SEVERITY=""
            PKG=""
            AFFECTED_VARIANTS=""
            FIX_MAP=""
            ALL_SAME_FIX=true
            LAST_FIXED=""
            FIRST_FIXED=true

            for VARIANT in $SCANNED; do
              ROW=$(jq -r --arg cve "$CVE_ID" '
                .Results[]?.Vulnerabilities[]? |
                select(.VulnerabilityID == $cve and (.Severity == "CRITICAL" or .Severity == "HIGH")) |
                "\(.Severity)\t\(.PkgName)\t\(.FixedVersion // "unknown")"
              ' "trivy-${VARIANT}.json" | head -1)
              [ -z "$ROW" ] && continue
              SEV=$(echo "$ROW" | cut -f1)
              PKG=$(echo "$ROW" | cut -f2)
              FIXED=$(echo "$ROW" | cut -f3)
              SEVERITY="$SEV"
              AFFECTED_VARIANTS="${AFFECTED_VARIANTS} ${VARIANT}"
              FIX_MAP="${FIX_MAP}\n- ${VARIANT}: \`${FIXED}\`"
              if $FIRST_FIXED; then
                LAST_FIXED="$FIXED"
                FIRST_FIXED=false
              elif [ "$FIXED" != "$LAST_FIXED" ]; then
                ALL_SAME_FIX=false
              fi
            done

            [ -z "$AFFECTED_VARIANTS" ] && continue

            LABELS="security,severity:$(echo "$SEVERITY" | tr '[:upper:]' '[:lower:]')"
            echo "$FIX_MAP" | grep -q "unknown" && LABELS="${LABELS},no-fix-available"
            $ALL_SAME_FIX || LABELS="${LABELS},needs-manual-review"

            EXISTING=$(echo "$OPEN_ISSUES" | jq -r --arg cve "$CVE_ID" \
              '.[] | select(.title | contains($cve)) | .number' | head -1)

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" \
                --body "Still detected in weekly scan (${TODAY}).
          Affected images:${AFFECTED_VARIANTS}
          $(printf '%b' "$FIX_MAP")"
            else
              TITLE="[SECURITY] ${CVE_ID}: ${PKG} (${SEVERITY})"
              BODY="**CVE:** ${CVE_ID}
          **Severity:** ${SEVERITY}
          **Package:** ${PKG}
          **First detected:** ${TODAY}
          **Affected images:**${AFFECTED_VARIANTS}

          **Fix versions:**
          $(printf '%b' "$FIX_MAP")

          To suppress after analysis: add to \`.trivyignore\`:
          \`\`\`
          ${CVE_ID}  # reason accepted
          \`\`\`"
              gh issue create --repo "$REPO" \
                --title "$TITLE" \
                --body "$BODY" \
                --label "$LABELS"
            fi
          done

  auto_fix:
    name: "Open auto-fix PR for fixable CVEs"
    needs: triage
    if: always() && needs.triage.result == 'success'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.CVE_AUTOFIX_TOKEN }}
          persist-credentials: false

      - name: Set up QEMU for multi-arch pin verification
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download scan artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trivy-*
          merge-multiple: true

      - name: Create auto-fix PR if applicable
        env:
          GH_TOKEN: ${{ secrets.CVE_AUTOFIX_TOKEN }}
          GH_ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Conditions for auto-fix PR (all must be true):
          # 1. CVE severity is HIGH or CRITICAL
          # 2. A fixed version exists (not "unknown") on at least one affected image
          # 3. Fix maps to a known mechanism:
          #    - nginx package CVE          → bump FROM nginx:<ver> in Dockerfiles
          #    - lego package CVE           → bump ARG LEGO_VERSION= in Dockerfiles
          #    - gobinary CVE in lego path  → bump ARG LEGO_VERSION= to latest release
          #    - OS package CVE (os-pkgs)   → pin a minimum version in the CVE pin block
          # 4. CVE not already covered by an open security PR

          TODAY=$(date +%Y-%m-%d)
          BRANCH="fix/cve-${TODAY}"

          # Check if fix branch already exists
          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "Auto-fix branch ${BRANCH} already exists — skipping."
            exit 0
          fi

          # CVE IDs already covered by open security PRs (dedup across scan cycles)
          COVERED_CVES=$(gh pr list --repo "$REPO" --label security --state open \
            --json body --limit 100 2>/dev/null \
            | jq -r '.[].body // ""' | grep -oE 'CVE-[0-9]+-[0-9]+' | sort -u || true)

          FIXABLE_NGINX=""
          FIXABLE_LEGO=""
          FIXABLE_OS_ITEMS=""
          OS_FIXES_DEB=""
          OS_FIXES_APK=""
          OS_FIXES_UBU=""
          OS_CVE_MAP_DEB=""
          OS_CVE_MAP_APK=""
          OS_CVE_MAP_UBU=""
          LEGO_TRANSITIVE_CVES=""
          INCOMPLETE_SCANS=""

          for VARIANT in debian alpine ubuntu; do
            if ! jq -e .SchemaVersion "trivy-${VARIANT}.json" > /dev/null 2>&1; then
              echo "::warning::trivy-${VARIANT}.json is missing or incomplete (the ${VARIANT} scan failed); no fixes from it this run."
              INCOMPLETE_SCANS="${INCOMPLETE_SCANS} ${VARIANT}"
              continue
            fi

            # nginx / lego direct CVEs
            while IFS=$'\t' read -r CVE_ID PKG FIXED; do
              [ -z "$CVE_ID" ] && continue
              echo "$COVERED_CVES" | grep -qx "$CVE_ID" && continue
              case "$PKG" in
                nginx*) FIXABLE_NGINX="${FIXABLE_NGINX} ${CVE_ID}(${FIXED})" ;;
                lego*)  FIXABLE_LEGO="${FIXABLE_LEGO} ${CVE_ID}(${FIXED})" ;;
              esac
            done < <(jq -r '
              .Results[]?.Vulnerabilities[]? |
              select(
                (.Severity == "CRITICAL" or .Severity == "HIGH") and
                ((.FixedVersion // "") != "") and .FixedVersion != "unknown"
              ) |
              "\(.VulnerabilityID)\t\(.PkgName)\t\(.FixedVersion)"
            ' "trivy-${VARIANT}.json" | sort -u)

            # OS package CVEs (class: os-pkgs) — pin a minimum version in the Dockerfile.
            # Trivy's fixed version is the Debian source version (or the apk version).
            # These are new fixes only: update_os_pins re-checks the pins already there.
            while IFS=$'\t' read -r CVE_ID PKG FIXED; do
              [ -z "$CVE_ID" ] && continue
              case "$PKG" in nginx*|lego*) continue ;; esac
              FIXABLE_OS_ITEMS="${FIXABLE_OS_ITEMS} ${CVE_ID}(${PKG}@${VARIANT}=${FIXED})"
              case "$VARIANT" in
                debian)
                  OS_FIXES_DEB="${OS_FIXES_DEB} ${PKG}>=${FIXED}"
                  OS_CVE_MAP_DEB="${OS_CVE_MAP_DEB} ${CVE_ID}:${PKG}>=${FIXED}" ;;
                alpine)
                  OS_FIXES_APK="${OS_FIXES_APK} ${PKG}>=${FIXED}"
                  OS_CVE_MAP_APK="${OS_CVE_MAP_APK} ${CVE_ID}:${PKG}>=${FIXED}" ;;
                ubuntu)
                  OS_FIXES_UBU="${OS_FIXES_UBU} ${PKG}>=${FIXED}"
                  OS_CVE_MAP_UBU="${OS_CVE_MAP_UBU} ${CVE_ID}:${PKG}>=${FIXED}" ;;
              esac
            done < <(jq -r '
              .Results[]? |
              select(.Class == "os-pkgs") |
              .Vulnerabilities[]? |
              select(
                (.Severity == "CRITICAL" or .Severity == "HIGH") and
                ((.FixedVersion // "") != "") and .FixedVersion != "unknown"
              ) |
              "\(.VulnerabilityID)\t\(.PkgName)\t\(.FixedVersion)"
            ' "trivy-${VARIANT}.json" | sort -u)

            # Lego transitive CVEs — Go modules inside the lego binary (gobinary)
            while IFS=$'\t' read -r CVE_ID PKG FIXED; do
              [ -z "$CVE_ID" ] && continue
              echo "$COVERED_CVES" | grep -qx "$CVE_ID" && continue
              echo "$LEGO_TRANSITIVE_CVES" | grep -qw "$CVE_ID" && continue
              LEGO_TRANSITIVE_CVES="${LEGO_TRANSITIVE_CVES} ${CVE_ID}"
            done < <(jq -r '
              .Results[]? |
              select(.Type == "gobinary" and (.Target | test("lego"; "i"))) |
              .Vulnerabilities[]? |
              select(.Severity == "CRITICAL" or .Severity == "HIGH") |
              "\(.VulnerabilityID)\t\(.PkgName)\t\(.FixedVersion // "unknown")"
            ' "trivy-${VARIANT}.json" | sort -u)
          done

          SCAN_NOTE="${INCOMPLETE_SCANS:+ (missing or incomplete scans:${INCOMPLETE_SCANS})}"

          # The scan above ran on images that already have the current pins, so a pin that
          # fixed its CVE is invisible to it. update_os_pins re-checks existing pins against
          # an image built without them and sets NEEDS_CLEANUP when one is dropped.
          NEEDS_CLEANUP=false
          HAS_PINS=false
          grep -q "CVE security pins" src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu \
            2>/dev/null && HAS_PINS=true

          if [ -z "$FIXABLE_NGINX" ] && [ -z "$FIXABLE_LEGO" ] && \
             [ -z "$FIXABLE_OS_ITEMS" ] && [ -z "$LEGO_TRANSITIVE_CVES" ] && \
             ! $HAS_PINS; then
            echo "No auto-fixable CVEs found${SCAN_NOTE} — no PR created."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          # Print the Dockerfile without its CVE security pins block, and without the blank
          # line that follows the block, so repeated rewrites do not pile up blank lines.
          strip_os_pins() {
            awk '/# --- CVE security pins \(auto-managed\)/ {skip=1}
                 /# --- end CVE security pins ---/ {skip=0; gap=1; next}
                 gap && /^$/ {gap=0; next}
                 {gap=0}
                 !skip {print}' "$1"
          }

          # Write or remove the CVE security pins block.
          # Empty FIXES removes the block (base image shipped the fix natively).
          write_os_pins() {
            local DOCKERFILE="$1" PM="$2" FIXES="$3"
            if [ -z "$FIXES" ]; then
              grep -q "CVE security pins" "$DOCKERFILE" 2>/dev/null || return 0
              strip_os_pins "$DOCKERFILE" > "${DOCKERFILE}.tmp" && mv "${DOCKERFILE}.tmp" "$DOCKERFILE"
              return
            fi
            local PKGS_FILE
            PKGS_FILE=$(mktemp)
            echo "$FIXES" | tr ' ' '\n' | grep -v '^$' | LC_ALL=C sort -u > "$PKGS_FILE"
            strip_os_pins "$DOCKERFILE" > "${DOCKERFILE}.tmp"
            if [ "$PM" = "apt" ]; then
              awk -v pf="$PKGS_FILE" '
                /^VOLUME/ {
                  print "# --- CVE security pins (auto-managed) ---"
                  print "# Each pin is a minimum source version: install the candidate, then check it."
                  print "RUN set -- \\"
                  while ((getline line < pf) > 0) printf "        \047%s\047 \\\n", line
                  print "    && apt-get update \\"
                  print "    && apt-get install -y --no-install-recommends $(for pin; do echo \"${pin%%>=*}\"; done) \\"
                  print "    && for pin; do \\"
                  print "        v=$(dpkg-query -W -f=\047${source:Version}\047 \"${pin%%>=*}\") \\"
                  print "            && dpkg --compare-versions \"$v\" ge \"${pin#*>=}\" \\"
                  print "            || { echo \"${pin%%>=*} ${v:-missing} is older than ${pin#*>=}\" >&2; exit 1; }; \\"
                  print "    done \\"
                  print "    && rm -rf /var/lib/apt/lists/*"
                  print "# --- end CVE security pins ---"
                  print ""
                }
                { print }
              ' "${DOCKERFILE}.tmp" > "$DOCKERFILE"
            else
              awk -v pf="$PKGS_FILE" '
                /^VOLUME/ {
                  printf "# --- CVE security pins (auto-managed) ---\nRUN apk add --no-cache"
                  while ((getline line < pf) > 0) printf " \047%s\047", line
                  printf "\n# --- end CVE security pins ---\n\n"
                }
                { print }
              ' "${DOCKERFILE}.tmp" > "$DOCKERFILE"
            fi
            rm -f "${DOCKERFILE}.tmp" "$PKGS_FILE"
          }

          # max_floors <image> <apt|apk> <pkg>=<ver>...: keep the highest floor per package,
          # compared by the image's own package manager.
          max_floors() {
            local IMG="$1" PM="$2"
            shift 2
            docker run --rm -i --entrypoint sh "$IMG" -s "$PM" "$@" <<'EOF'
          pm=$1; shift
          newer() {
            if [ "$pm" = apt ]; then dpkg --compare-versions "$1" gt "$2"
            else [ "$(apk version -t "$1" "$2")" = ">" ]; fi
          }
          for fix; do echo "${fix%%>=*} ${fix#*>=}"; done | sort -k1,1 | {
            prev=""; best=""
            while read -r pkg ver; do
              if [ "$pkg" = "$prev" ]; then
                if newer "$ver" "$best"; then best=$ver; fi
              else
                if [ -n "$prev" ]; then echo "$prev>=$best"; fi
                prev=$pkg; best=$ver
              fi
            done
            if [ -n "$prev" ]; then echo "$prev>=$best"; fi
          }
          EOF
          }

          # For each pending package, test-build a minimal image for all target platforms.
          # Passes only verified packages; records failures in FAIL_DIR (one file per CVE+pkg).
          # File name: <CVE>___<pkg>=<ver>, contents: line 1 = platforms, rest = build error.
          verify_and_filter_pins() {
            local DOCKERFILE="$1" PM="$2" FIXES="$3" CVE_MAP="$4" FAIL_DIR="$5"
            [ -z "$FIXES" ] && return
            local BASE_IMG PLATFORMS
            BASE_IMG=$(grep '^FROM ' "$DOCKERFILE" | head -1 | awk '{print $2}')
            case "$DOCKERFILE" in
              *Dockerfile-alpine) PLATFORMS="linux/amd64,linux/arm64" ;;
              *Dockerfile-ubuntu) PLATFORMS="linux/amd64,linux/arm64" ;;
              *)                  PLATFORMS="linux/amd64,linux/386,linux/arm64,linux/arm/v7" ;;
            esac
            # One floor per package, so a package's CVEs are all pinned or all skipped.
            local MAXED
            # shellcheck disable=SC2086
            MAXED=$(max_floors "$BASE_IMG" "$PM" $FIXES) || {
              echo "::warning::cannot compare package versions in ${BASE_IMG}; no new pins for ${DOCKERFILE}" >&2
              return 0
            }
            FIXES=$MAXED
            local VERIFIED=""
            for PKG_VER in $(echo "$FIXES" | tr ' ' '\n' | grep -v '^$' | sort -u); do
              local TEST_DIR BUILD_LOG BUILD_OK
              TEST_DIR=$(mktemp -d)
              # The same block the Dockerfile gets, for this one package.
              printf 'FROM %s\nVOLUME /cve-verify\n' "$BASE_IMG" > "${TEST_DIR}/Dockerfile"
              write_os_pins "${TEST_DIR}/Dockerfile" "$PM" "$PKG_VER"
              set +e
              BUILD_LOG=$(docker buildx build --platform "$PLATFORMS" "${TEST_DIR}" 2>&1)
              BUILD_OK=$?
              set -e
              rm -rf "$TEST_DIR"
              if [ "$BUILD_OK" -eq 0 ]; then
                VERIFIED="${VERIFIED} ${PKG_VER}"
              else
                local PKG_NAME CVE_FOR_PKG
                PKG_NAME=${PKG_VER%%>=*}
                # The package gets no new pin, so each CVE it was to fix gets the note.
                for CVE_FOR_PKG in $(echo "$CVE_MAP" | tr ' ' '\n' \
                    | awk -F: -v p="$PKG_NAME" '{split($2, a, ">="); if (a[1] == p) print $1}' | sort -u); do
                  {
                    echo "$PLATFORMS"
                    echo "$BUILD_LOG" | tail -10
                  } > "${FAIL_DIR}/${CVE_FOR_PKG}___${PKG_VER}"
                done
              fi
            done
            echo "$VERIFIED"
          }

          FAIL_DIR=$(mktemp -d)
          VERIFIED_DEB=$(verify_and_filter_pins "src/Dockerfile"        "apt" "$OS_FIXES_DEB" "$OS_CVE_MAP_DEB" "$FAIL_DIR")
          VERIFIED_APK=$(verify_and_filter_pins "src/Dockerfile-alpine" "apk" "$OS_FIXES_APK" "$OS_CVE_MAP_APK" "$FAIL_DIR")
          VERIFIED_UBU=$(verify_and_filter_pins "src/Dockerfile-ubuntu" "apt" "$OS_FIXES_UBU" "$OS_CVE_MAP_UBU" "$FAIL_DIR")

          # The CVE pin block a Dockerfile carries, markers included.
          os_pins_block() {
            awk '/# --- CVE security pins \(auto-managed\)/, /# --- end CVE security pins ---/' "$1"
          }

          # Pins currently in a Dockerfile's block, one per line (pkg>=ver).
          current_pins() {
            os_pins_block "$1" | grep -oE "'[^' ]+>=[^' ]+'" | tr -d "'" | sort -u || true
          }

          # check_os_pins <dockerfile> <apt|apk>: stop when the block is not the one write_os_pins
          # writes back from the pins current_pins can read — an older pin format, a hand edit —
          # because rewriting it would drop whatever could not be read. Change the block layout
          # in write_os_pins and in the Dockerfiles in the same commit.
          check_os_pins() {
            local DOCKERFILE="$1" PM="$2" COPY BLOCK_DIFF DIFF_RC=0 AFTER
            grep -q "CVE security pins" "$DOCKERFILE" 2>/dev/null || return 0
            COPY=$(mktemp)
            cp "$DOCKERFILE" "$COPY"
            write_os_pins "$COPY" "$PM" "$(current_pins "$DOCKERFILE" | tr '\n' ' ')"
            BLOCK_DIFF=$(diff <(os_pins_block "$DOCKERFILE") <(os_pins_block "$COPY")) || DIFF_RC=$?
            rm -f "$COPY"
            if [ "$DIFF_RC" -gt 1 ]; then
              echo "::error::${DOCKERFILE}: the CVE pin block could not be compared with the one this job writes (diff exited ${DIFF_RC})."
              exit 1
            fi
            if [ -n "$BLOCK_DIFF" ]; then
              echo "::error::${DOCKERFILE}: the CVE pin block is not the one this job writes from the pins it can read, so rewriting it would drop pins; the difference is in the log below."
              echo "$BLOCK_DIFF"
              exit 1
            fi
            # write_os_pins inserts the block ahead of every VOLUME line, so a block that is not
            # in front of one would be moved by a rewrite; blank and comment lines may sit between.
            AFTER=$(awk '/# --- end CVE security pins ---/ {f = 1; next}
                         f && NF && $0 !~ /^[[:space:]]*#/ {print; exit}' "$DOCKERFILE")
            case "$AFTER" in
              VOLUME*) ;;
              *)
                echo "::error::${DOCKERFILE}: the instruction after the CVE pin block is '${AFTER:-none}', not VOLUME, so a rewrite would move the block; put it in front of VOLUME or change write_os_pins."
                exit 1
                ;;
            esac
          }

          # keep_needed_pins <dockerfile> <apt|apk>: print the pins that an image built without
          # the block still needs: that image's version is below the pinned minimum, or apt
          # would still upgrade the package (apk keeps an installed version that meets it).
          # Keeps every pin when that image cannot be built or fully inspected.
          keep_needed_pins() {
            local DOCKERFILE="$1" PM="$2" PINS OUT PROBE
            PINS=$(current_pins "$DOCKERFILE")
            [ -z "$PINS" ] && return 0
            PROBE=$(mktemp)
            cat > "$PROBE" <<'EOF'
          pm=$1; shift
          if [ "$pm" = apt ]; then
            upd=$(apt-get update -qq 2>&1) && [ -z "$upd" ] || exit 1
          fi
          for pin; do
            pkg=${pin%%>=*}; min=${pin#*>=}
            if [ "$pm" = apt ]; then
              v=$(dpkg-query -W -f='${source:Version}' "$pkg" 2>/dev/null) || { echo "drop $pin"; continue; }
              inst=$(dpkg-query -W -f='${Version}' "$pkg")
              cand=$(apt-cache policy "$pkg" | awk '$1 == "Candidate:" {print $2}')
              if dpkg --compare-versions "$v" lt "$min" || dpkg --compare-versions "$inst" lt "$cand" 2>/dev/null; then
                echo "keep $pin"
              else
                echo "drop $pin"
              fi
            else
              v=$(apk list -I 2>/dev/null | awk -v p="$pkg" '{n = $1; sub(/-[^-]*-r[0-9]+$/, "", n); if (n == p) {print substr($1, length(p) + 2); exit}}')
              if [ -z "$v" ]; then echo "drop $pin"
              elif [ "$(apk version -t "$v" "$min")" = "<" ]; then echo "keep $pin"
              else echo "drop $pin"; fi
            fi
          done
          echo done
          EOF
            strip_os_pins "$DOCKERFILE" > "${DOCKERFILE}.unpinned"
            # shellcheck disable=SC2086
            if docker buildx build --platform linux/amd64 --load -t cve-unpinned \
                 -f "${DOCKERFILE}.unpinned" "$(dirname "$DOCKERFILE")" > /dev/null 2>&1 \
               && OUT=$(docker run --rm -i --entrypoint sh cve-unpinned -s "$PM" $PINS < "$PROBE") \
               && [ "$(echo "$OUT" | tail -1)" = "done" ]; then
              echo "$OUT" | sed -n 's/^keep //p'
            else
              echo "::warning::could not re-check the CVE pins in ${DOCKERFILE}; keeping all of them" >&2
              echo "$PINS"
            fi
            rm -f "${DOCKERFILE}.unpinned" "$PROBE"
          }

          # merge_pins <kept> <new>: a new pin replaces a kept pin for the same package.
          merge_pins() {
            # shellcheck disable=SC2086
            printf '%s\n' $1 | awk -v new="$2" '
              BEGIN { n = split(new, a, " "); for (i = 1; i <= n; i++) { split(a[i], b, ">="); replaced[b[1]] = 1 } }
              $0 != "" { split($0, c, ">="); if (!(c[1] in replaced)) print }
              END { for (i = 1; i <= n; i++) print a[i] }'
          }

          # update_os_pins <dockerfile> <apt|apk> <verified new pins>: rewrite the block from the
          # pins still needed plus the new ones; sets NEEDS_CLEANUP when a pin is dropped.
          update_os_pins() {
            local DOCKERFILE="$1" PM="$2" NEW="$3" KEPT BEFORE
            check_os_pins "$DOCKERFILE" "$PM"
            BEFORE=$(current_pins "$DOCKERFILE" | grep -c . || true)
            KEPT=$(keep_needed_pins "$DOCKERFILE" "$PM")
            if [ "$(echo "$KEPT" | grep -c . || true)" -lt "$BEFORE" ]; then NEEDS_CLEANUP=true; fi
            write_os_pins "$DOCKERFILE" "$PM" "$(merge_pins "$KEPT" "$NEW" | tr '\n' ' ')"
          }

          update_os_pins "src/Dockerfile"        "apt" "$VERIFIED_DEB"
          update_os_pins "src/Dockerfile-alpine" "apk" "$VERIFIED_APK"
          update_os_pins "src/Dockerfile-ubuntu" "apt" "$VERIFIED_UBU"

          # The PR body lists only CVEs whose package got a new pin that passed the test
          # build; triage auto-closes the PR by the CVE IDs in its body.
          PINNED_OS_ITEMS=""
          for ITEM in $FIXABLE_OS_ITEMS; do
            PKG_AT=${ITEM#*(}; PKG_AT=${PKG_AT%%=*}
            case "${PKG_AT#*@}" in
              debian) NEW_PINS=$VERIFIED_DEB ;;
              alpine) NEW_PINS=$VERIFIED_APK ;;
              *)      NEW_PINS=$VERIFIED_UBU ;;
            esac
            # shellcheck disable=SC2086
            if printf '%s\n' $NEW_PINS | awk -F'>=' -v p="${PKG_AT%@*}" '$1 == p {f = 1} END {exit !f}'; then
              PINNED_OS_ITEMS="${PINNED_OS_ITEMS} ${ITEM}"
            fi
          done

          # Post issue comments for packages that failed multi-arch verification
          OPEN_ISSUES_PINS=$(gh issue list --repo "$REPO" --label security \
            --state open --json number,title --limit 100 2>/dev/null || echo "[]")
          for FAIL_FILE in "$FAIL_DIR"/*; do
            [ -f "$FAIL_FILE" ] || continue
            BASENAME=$(basename "$FAIL_FILE")
            FAIL_CVE=${BASENAME%%___*}
            FAIL_PKG=${BASENAME##*___}
            FAIL_PLATFORMS=$(head -1 "$FAIL_FILE")
            FAIL_MSG=$(tail -n +2 "$FAIL_FILE")
            [ -z "$FAIL_CVE" ] && continue
            ISSUE_NUM=$(echo "$OPEN_ISSUES_PINS" | jq -r --arg cve "$FAIL_CVE" \
              '.[] | select(.title | contains($cve)) | .number' | head -1)
            [ -z "$ISSUE_NUM" ] && continue
            COMMENT=$(printf '**Auto-fix blocked for `%s`:** the test build did not pass on all target platforms (`%s`) — pin skipped for this image variant.\n```\n%s\n```' \
              "$FAIL_PKG" "$FAIL_PLATFORMS" "$FAIL_MSG")
            GH_TOKEN="$GH_ISSUE_TOKEN" gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "$COMMENT"
          done
          rm -rf "$FAIL_DIR"

          # Bump nginx FROM version if nginx package CVEs found
          if [ -n "$FIXABLE_NGINX" ]; then
            RAW_VER=$(echo "$FIXABLE_NGINX" | grep -oE '\([^)]+\)' | head -1 | tr -d '()')
            NGINX_VER=$(echo "$RAW_VER" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            if [ -n "$NGINX_VER" ]; then
              sed -i "s|^FROM nginx:[^ ]*|FROM nginx:${NGINX_VER}|" src/Dockerfile
              sed -i "s|^FROM nginx:[^ ]*-alpine[^ ]*|FROM nginx:${NGINX_VER}-alpine|" \
                src/Dockerfile-alpine
            fi
          fi

          # Bump lego ARG version for direct lego CVEs or transitive gobinary CVEs.
          # For transitive CVEs the fix version is a Go module version, not a lego version;
          # the only automated fix is upgrading lego itself to pick up the patched dependency.
          LEGO_NOTE=""
          if [ -n "$FIXABLE_LEGO" ] || [ -n "$LEGO_TRANSITIVE_CVES" ]; then
            LATEST_LEGO=$(curl -sf "https://api.github.com/repos/go-acme/lego/releases/latest" \
              | jq -r '.tag_name' | sed 's/^v//')
            CURRENT_LEGO=$(grep -m1 '^ARG LEGO_VERSION=' src/Dockerfile \
              | sed 's/ARG LEGO_VERSION=//')
            if [ -n "$LATEST_LEGO" ] && [ "$LATEST_LEGO" != "$CURRENT_LEGO" ]; then
              sed -i "s/^ARG LEGO_VERSION=.*/ARG LEGO_VERSION=${LATEST_LEGO}/" \
                src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu
              LEGO_NOTE="Bumped lego ${CURRENT_LEGO} → ${LATEST_LEGO}"
            else
              LEGO_NOTE="lego already at latest (${CURRENT_LEGO:-unknown}); transitive CVEs require an upstream lego release"
              # Comment on each affected issue so it's clear why no auto-fix was applied
              if [ -n "$LEGO_TRANSITIVE_CVES" ]; then
                OPEN_ISSUES_AF=$(gh issue list --repo "$REPO" --label security \
                  --state open --json number,title --limit 100 2>/dev/null || echo "[]")
                for TR_CVE in $LEGO_TRANSITIVE_CVES; do
                  TR_ISSUE=$(echo "$OPEN_ISSUES_AF" | jq -r --arg cve "$TR_CVE" \
                    '.[] | select(.title | contains($cve)) | .number' | head -1)
                  [ -z "$TR_ISSUE" ] && continue
                  GH_TOKEN="$GH_ISSUE_TOKEN" gh issue comment "$TR_ISSUE" --repo "$REPO" --body \
                    "**Auto-fix blocked:** ${TR_CVE} is in a Go module inside the lego binary (not an OS package). The only fix is a lego release that vendors the patched dependency. Lego is already at the latest release (\`${CURRENT_LEGO}\`) which still includes the vulnerable version. No action possible until lego upstream publishes a fix."
                done
              fi
            fi
          fi

          # Only create a PR if there are actual Dockerfile changes
          git add src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu
          if git diff --cached --quiet; then
            echo "No Dockerfile changes to commit${SCAN_NOTE} — skipping PR."
            exit 0
          fi

          # Dedup across scan cycles: if an open security PR already proposes the
          # exact same Dockerfile contents, don't open a duplicate. The CVE-ID
          # dedup above is blind to fix types that emit no CVE ID in the body
          # (lego version bumps, stale-pin removals), which otherwise produce a
          # fresh identical PR on every scan.
          for existing in $(gh pr list --repo "$REPO" --label security --state open \
                            --json number --jq '.[].number'); do
            ref=$(gh pr view "$existing" --repo "$REPO" --json headRefName --jq '.headRefName')
            identical=true
            for f in src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu; do
              remote=$(gh api "repos/${REPO}/contents/${f}?ref=${ref}" \
                       --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ "$remote" != "$(cat "$f")" ]; then
                identical=false
                break
              fi
            done
            if [ "$identical" = true ]; then
              echo "Open security PR #${existing} already proposes these exact changes${SCAN_NOTE} — skipping."
              exit 0
            fi
          done

          git commit -m "fix: auto-fix CVEs from vulnerability scan (${TODAY})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$BRANCH"

          PR_BODY_FILE=$(mktemp)
          printf '%s\n' \
            "Auto-fix PR for CVEs detected in weekly vulnerability scan (${TODAY})." \
            > "$PR_BODY_FILE"
          if [ -n "$FIXABLE_NGINX" ]; then
            printf '\n**nginx CVEs fixed:**\n' >> "$PR_BODY_FILE"
            printf '%s\n' $FIXABLE_NGINX \
              | sed 's/\([^(]*\)(\(.*\))/- `\1` → nginx `\2`/' \
              >> "$PR_BODY_FILE"
          fi
          if [ -n "$FIXABLE_LEGO" ]; then
            printf '\n**lego CVEs fixed:**\n' >> "$PR_BODY_FILE"
            printf '%s\n' $FIXABLE_LEGO \
              | sed 's/\([^(]*\)(\(.*\))/- `\1` → lego `\2`/' \
              >> "$PR_BODY_FILE"
          fi
          if [ -n "$LEGO_TRANSITIVE_CVES" ]; then
            printf '\n**lego transitive CVEs (gobinary):** %s\n' \
              "$LEGO_NOTE" >> "$PR_BODY_FILE"
          fi
          if [ -n "$PINNED_OS_ITEMS" ]; then
            printf '\n**OS package CVEs pinned:**\n' >> "$PR_BODY_FILE"
            printf '%s\n' $PINNED_OS_ITEMS \
              | sed 's/\([^(]*\)(\([^@]*\)@\([^=]*\)=\(.*\))/- `\1` — \2 (\3) → `\4`/' \
              >> "$PR_BODY_FILE"
          fi
          if $NEEDS_CLEANUP; then
            printf '\n**Stale OS package pins removed:** base image update resolved the CVE natively — the minimum-version pins are no longer needed.\n' \
              >> "$PR_BODY_FILE"
          fi
          if [ -n "$INCOMPLETE_SCANS" ]; then
            printf '\n**Scans that did not complete:**%s — CVEs of those images are not covered here.\n' \
              "$INCOMPLETE_SCANS" >> "$PR_BODY_FILE"
          fi
          gh pr create \
            --title "fix: auto-fix CVEs from vulnerability scan (${TODAY})" \
            --body "$(cat "$PR_BODY_FILE")" \
            --base master \
            --label security
          rm -f "$PR_BODY_FILE"
