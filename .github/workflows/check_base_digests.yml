name: "check-base-digests"

# Upstream rebuilds a base image tag in place (same nginx or Ubuntu version, newer
# OS packages). Every Dockerfile pins its base by digest, so nothing picks such a
# rebuild up: this re-pins the bases and opens a PR listing the CRITICAL/HIGH CVEs
# the new bases fix. The PR's build and tests run on the new bases before any
# release uses them.

on:
  schedule:
    # Every Monday at 10:00 UTC, after check-lego-update (08:00) and check-nginx-update (09:00)
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stale:
    name: "Find rebuilt base images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bases: ${{ steps.find.outputs.bases }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: List pins whose tag was rebuilt
        id: find
        run: |
          set +e
          .github/base_digests.sh --check > "${RUNNER_TEMP}/stale.txt"
          rc=$?
          set -e
          [ "$rc" -le 1 ] || exit "$rc"
          cat "${RUNNER_TEMP}/stale.txt"
          bases=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ")
            | {image: .[1], old: (.[1] + "@" + .[2]), new: (.[1] + "@" + .[3])}) | unique' \
            "${RUNNER_TEMP}/stale.txt")
          echo "bases=${bases}" >> "$GITHUB_OUTPUT"

  scan:
    name: "Scan ${{ matrix.base.image }}"
    needs: stale
    if: needs.stale.outputs.bases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.stale.outputs.bases) }}
    steps:
      - name: Scan the pinned base
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: ${{ matrix.base.old }}
          severity: CRITICAL,HIGH
          format: json
          output: old.json
          exit-code: 0

      - name: Scan the rebuilt base
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: ${{ matrix.base.new }}
          severity: CRITICAL,HIGH
          format: json
          output: new.json
          exit-code: 0

      - name: List the CVEs the rebuild fixes
        id: fixed
        env:
          IMAGE: ${{ matrix.base.image }}
        run: |
          ids() {
            jq -r '[.Results[]?.Vulnerabilities[]? | .VulnerabilityID] | unique[]' "$1"
          }
          fixed=$(comm -23 <(ids old.json | sort) <(ids new.json | sort) | paste -sd ' ' -)
          name=$(echo "${IMAGE}" | tr ':/' '__')
          printf '%s|%s\n' "${IMAGE}" "${fixed:-none}" > "fixed-${name}.txt"
          echo "${IMAGE}: ${fixed:-no CRITICAL/HIGH CVE fixed}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-${{ steps.fixed.outputs.name }}
          path: fixed-*.txt
          retention-days: 7

  pull_request:
    name: "Open the refresh PR"
    needs: [stale, scan]
    if: always() && needs.stale.result == 'success' && needs.stale.outputs.bases != '[]'
    runs-on: ubuntu-latest
    environment: cve-autofix
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the scan results
        if: needs.scan.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fixed-*
          path: ${{ runner.temp }}/fixed
          merge-multiple: true

      - name: Re-pin the bases and write the PR body
        run: |
          .github/base_digests.sh --update > "${RUNNER_TEMP}/stale.txt"
          {
            echo "Upstream rebuilt these base image tags in place (same version, new digest):"
            echo
            echo "| Dockerfile | Image | Pinned | Now |"
            echo "|---|---|---|---|"
            awk '{ printf "| `%s` | `%s` | `%s` | `%s` |\n", $1, $2, substr($3, 1, 19), substr($4, 1, 19) }' \
              "${RUNNER_TEMP}/stale.txt"
            echo
            echo "**CRITICAL/HIGH CVEs the new bases fix:**"
            if ls "${RUNNER_TEMP}"/fixed/fixed-*.txt > /dev/null 2>&1; then
              cat "${RUNNER_TEMP}"/fixed/fixed-*.txt | while IFS='|' read -r image fixed; do
                echo "- \`${image}\`: ${fixed}"
              done
            else
              echo "- not available; the scans in this PR's build show the current state"
            fi
            echo
            echo "This PR was opened automatically by the \`check-base-digests\` workflow."
            echo "The build CI rebuilds and tests every image variant on the new bases."
          } > "${RUNNER_TEMP}/body.md"
          cat "${RUNNER_TEMP}/body.md"

      - name: Open pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.CVE_AUTOFIX_TOKEN }}
          branch: "bump/base-digests"
          add-paths: |
            src/Dockerfile
            src/Dockerfile-alpine
            src/Dockerfile-ubuntu
          commit-message: "fix: refresh the base images"
          title: "fix: refresh the base images"
          body-path: ${{ runner.temp }}/body.md
          labels: "dependencies"
