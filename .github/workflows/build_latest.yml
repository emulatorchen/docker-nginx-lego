name: "build-latest"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "src/**"
      - ".trivyignore"
  pull_request:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            images:
              - "src/Dockerfile*"
              - "src/scripts/cve_mitigations.sh"
              - ".trivyignore"

  docker_buildx_debian:
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Docker on tmpfs
        uses: JonasAlfredsson/docker-on-tmpfs@55e939ef196646234a12c245e3414879e3580f01 # v2.0.0
        with:
          tmpfs_size: 7
          swap_size: 9

      - name: Perform setup steps
        uses: JonasAlfredsson/checkout-qemu-buildx@1ef57f66f3e2960c64983b9ee94e155d466500e1 # v2.0.0
        with:
          should_login: false

      - name: Build Debian amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:debian

      - name: Scan Debian image
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:debian
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: sarif
          output: trivy-debian.sarif
          exit-code: 0

      - name: Upload Debian SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-debian.sarif
          category: trivy-debian

      - name: Build Debian image (validate only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: |
            linux/amd64
            linux/386
            linux/arm64
            linux/arm/v7
          push: false
          tags: emulator/docker-nginx-lego:latest

  docker_buildx_alpine:
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Docker on tmpfs
        uses: JonasAlfredsson/docker-on-tmpfs@55e939ef196646234a12c245e3414879e3580f01 # v2.0.0
        with:
          tmpfs_size: 7
          swap_size: 9

      - name: Perform setup steps
        uses: JonasAlfredsson/checkout-qemu-buildx@1ef57f66f3e2960c64983b9ee94e155d466500e1 # v2.0.0
        with:
          should_login: false

      - name: Build Alpine amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile-alpine
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:alpine

      - name: Scan Alpine image
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:alpine
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: sarif
          output: trivy-alpine.sarif
          exit-code: 0

      - name: Upload Alpine SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-alpine.sarif
          category: trivy-alpine

      - name: Build Alpine image (validate only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile-alpine
          platforms: |
            linux/amd64
            linux/arm64
          push: false
          tags: emulator/docker-nginx-lego:latest-alpine

  docker_buildx_ubuntu:
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Docker on tmpfs
        uses: JonasAlfredsson/docker-on-tmpfs@55e939ef196646234a12c245e3414879e3580f01 # v2.0.0
        with:
          tmpfs_size: 7
          swap_size: 9

      - name: Perform setup steps
        uses: JonasAlfredsson/checkout-qemu-buildx@1ef57f66f3e2960c64983b9ee94e155d466500e1 # v2.0.0
        with:
          should_login: false

      - name: Build Ubuntu amd64 image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile-ubuntu
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:ubuntu

      - name: Scan Ubuntu image
        uses: lhotari/sandboxed-trivy-action@f01374b6cc3bf7264ab238293e94f6db7ada6dd0 # v1.0.2
        with:
          scan-ref: scan-target:ubuntu
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          format: sarif
          output: trivy-ubuntu.sarif
          exit-code: 0

      - name: Upload Ubuntu SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cb06a0a8527b2c6970741b3a0baa15231dc74a4c # v4.34.1
        with:
          sarif_file: trivy-ubuntu.sarif
          category: trivy-ubuntu

      - name: Build Ubuntu image (validate only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile-ubuntu
          platforms: |
            linux/amd64
            linux/arm64
          push: false
          tags: emulator/docker-nginx-lego:latest-ubuntu

  build_status:
    name: "Build status"
    needs: [docker_buildx_debian, docker_buildx_alpine, docker_buildx_ubuntu]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          if [ "${DOCKER_BUILDX_DEBIAN_RESULT}" = "failure" ] || \
             [ "${DOCKER_BUILDX_ALPINE_RESULT}" = "failure" ] || \
             [ "${DOCKER_BUILDX_UBUNTU_RESULT}" = "failure" ]; then
            exit 1
          fi
        env:
          DOCKER_BUILDX_ALPINE_RESULT: ${{ needs.docker_buildx_alpine.result }}
          DOCKER_BUILDX_DEBIAN_RESULT: ${{ needs.docker_buildx_debian.result }}
          DOCKER_BUILDX_UBUNTU_RESULT: ${{ needs.docker_buildx_ubuntu.result }}
