name: "check-nginx-update"

on:
  schedule:
    # Run every Monday at 09:00 UTC (1h after check-lego-update)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check_nginx_version:
    name: "Check for new nginx release"
    runs-on: ubuntu-latest
    environment: cve-autofix
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get latest nginx release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails the run, so no PR is opened, when GitHub gives no usable version.
          LATEST=$(.github/latest_version.sh nginx)
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest nginx release: ${LATEST}"

      - name: Get pinned nginx version from Dockerfile
        id: pinned
        run: |
          PINNED=$(grep -m1 '^FROM nginx:' src/Dockerfile | sed 's/FROM nginx://; s/@sha256:[^ ]*//')
          echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Pinned nginx version: ${PINNED}"

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
        run: |
          if [ "$LATEST" = "$PINNED" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "nginx is up to date ($PINNED)"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New nginx version available: $LATEST (current: $PINNED)"
          fi

      - name: Update nginx version in Dockerfiles
        id: update
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          cp src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu "${RUNNER_TEMP}/"
          # Change only the tag; base_digests.sh then pins the digest the new tag has
          # on Docker Hub, and refuses anything that is not a sha256 digest.
          sed -i "s|^FROM nginx:[^@ -]*@|FROM nginx:${NEW}@|" src/Dockerfile
          sed -i "s|^FROM nginx:[^@ ]*-alpine@|FROM nginx:${NEW}-alpine@|" src/Dockerfile-alpine
          sed -i "s/^ARG NGINX_VERSION=.*/ARG NGINX_VERSION=${NEW}/" src/Dockerfile-ubuntu
          set +e
          .github/base_digests.sh --update src/Dockerfile src/Dockerfile-alpine
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            # nginx tags a release on GitHub before its images reach Docker Hub.
            cp "${RUNNER_TEMP}/Dockerfile" "${RUNNER_TEMP}/Dockerfile-alpine" "${RUNNER_TEMP}/Dockerfile-ubuntu" src/
            echo "::notice::nginx ${NEW} has no image on Docker Hub yet; no PR this run, the next run checks again"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          grep -qE "^FROM nginx:${NEW//./\\.}@sha256:[0-9a-f]{64}$" src/Dockerfile
          grep -qE "^FROM nginx:${NEW//./\\.}-alpine@sha256:[0-9a-f]{64}$" src/Dockerfile-alpine
          grep -qxF "ARG NGINX_VERSION=${NEW}" src/Dockerfile-ubuntu
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.compare.outputs.up_to_date == 'false' && steps.update.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.CVE_AUTOFIX_TOKEN }}
          branch: "bump/nginx-${{ steps.latest.outputs.version }}"
          commit-message: "Bump nginx from ${{ steps.pinned.outputs.version }} to ${{ steps.latest.outputs.version }}"
          title: "Bump nginx from ${{ steps.pinned.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            Automated nginx version bump.

            - **From:** `${{ steps.pinned.outputs.version }}`
            - **To:** `${{ steps.latest.outputs.version }}`
            - **Release notes:** https://nginx.org/en/CHANGES

            This PR was opened automatically by the `check-nginx-update` workflow.
            The build CI will validate the new image across all platforms.
          labels: "dependencies"
