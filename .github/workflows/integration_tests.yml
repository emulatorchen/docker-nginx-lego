name: "integration-tests"

# Runs on pull_request so the PR code is tested directly.
# Secrets are available for same-repo PRs; fork PRs skip gracefully when
# FREEMYIP_TOKEN is not set.
#
# Required repository variables:
#   FREEMYIP_DOMAIN    e.g. this.freemyip.com
#   FREEMYIP_CERT_NAME e.g. this-freemyip.dns-freemyip
#
# Required repository secrets:
#   FREEMYIP_TOKEN

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - "src/**"
              - "tests/integration/**"

  integration_freemyip:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    name: "DNS-01 via FreeMyIP (staging)"
    runs-on: ubuntu-latest
    environment: automation
    timeout-minutes: 30
    steps:
      - name: Check secrets and variables
        id: check
        env:
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
          FREEMYIP_DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
          FREEMYIP_TOKEN: ${{ secrets.FREEMYIP_TOKEN }}
        run: |
          if [ -z "${FREEMYIP_TOKEN}" ]; then
            echo "Skipping: FREEMYIP_TOKEN secret is not configured (fork or external PR)"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ -z "${FREEMYIP_DOMAIN}" ] || [ -z "${FREEMYIP_CERT_NAME}" ]; then
            echo "ERROR: FREEMYIP_TOKEN is set but domain variables are missing."
            echo "Set these in: Settings → Secrets and variables → Variables"
            echo "  FREEMYIP_DOMAIN     your freemyip subdomain, e.g. mysite.freemyip.com"
            echo "  FREEMYIP_CERT_NAME  lego cert name, e.g. mysite-freemyip.dns-freemyip"
            exit 1
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Debian image (amd64)
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          load: true
          tags: docker-nginx-lego:integration-test

      - name: Create credentials directory
        if: steps.check.outputs.skip != 'true'
        run: mkdir -p /tmp/lego-test-creds

      - name: Write FreeMyIP credentials
        if: steps.check.outputs.skip != 'true'
        env:
          FREEMYIP_TOKEN: ${{ secrets.FREEMYIP_TOKEN }}
        run: |
          printf 'FREEMYIP_TOKEN=%s\n' "$FREEMYIP_TOKEN" > /tmp/lego-test-creds/freemyip.ini

      - name: Write FreeMyIP nginx config
        if: steps.check.outputs.skip != 'true'
        env:
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
          FREEMYIP_DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
        run: |
          mkdir -p /tmp/lego-test-conf
          cat > /tmp/lego-test-conf/freemyip.conf << EOF
          server {
              listen 443 ssl;
              server_name ${FREEMYIP_DOMAIN};
              ssl_certificate     /etc/letsencrypt/live/${FREEMYIP_CERT_NAME}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${FREEMYIP_CERT_NAME}/privkey.pem;
              location / { return 200 "ok"; add_header Content-Type text/plain; }
          }
          EOF

      # One staging certificate per run: the split's issuer orders it by DNS-01,
      # the split's server serves it, and a single container on the same store
      # must keep it instead of ordering another.
      - name: Issue by DNS-01 in the split, serve it, reuse it in a single container
        if: steps.check.outputs.skip != 'true'
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
          FREEMYIP_DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
        run: |
          tests/integration/dns01_split.sh docker-nginx-lego:integration-test \
            "${FREEMYIP_CERT_NAME}" "${FREEMYIP_DOMAIN}" /tmp/lego-test-creds /tmp/lego-test-conf

      - name: Print container logs
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          for c in nginx-lego-issuer nginx-lego-server nginx-lego-test; do
            echo "== ${c}"
            docker logs "${c}" || true
          done

      - name: Stop and remove containers
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          docker rm -f nginx-lego-issuer nginx-lego-server nginx-lego-test || true
          docker volume rm lego-test-certs || true

  nonroot_smoke:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    name: "Non-root smoke test (${{ matrix.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: ./src/Dockerfile
          - variant: alpine
            dockerfile: ./src/Dockerfile-alpine
          - variant: ubuntu
            dockerfile: ./src/Dockerfile-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build ${{ matrix.variant }} image (amd64)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ./src
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: docker-nginx-lego:smoke-${{ matrix.variant }}

      - name: Run the non-root smoke test
        env:
          VARIANT: ${{ matrix.variant }}
        run: tests/integration/smoke_nonroot.sh "docker-nginx-lego:smoke-${VARIANT}"

      # The opt-in split (NGINX_LEGO_ROLE): issuer and server in two containers.
      - name: Run the split smoke test
        env:
          VARIANT: ${{ matrix.variant }}
        run: tests/integration/smoke_split.sh "docker-nginx-lego:smoke-${VARIANT}"

  integration_status:
    name: "Integration test status"
    needs: [integration_freemyip, nonroot_smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${INTEGRATION_FREEMYIP_RESULT}" = "failure" ] || \
             [ "${NONROOT_SMOKE_RESULT}" = "failure" ]; then
            exit 1
          fi
        env:
          INTEGRATION_FREEMYIP_RESULT: ${{ needs.integration_freemyip.result }}
          NONROOT_SMOKE_RESULT: ${{ needs.nonroot_smoke.result }}
