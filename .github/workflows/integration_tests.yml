name: "integration-tests"

# Runs on pull_request so the PR code is tested directly.
# Secrets are available for same-repo PRs; fork PRs skip gracefully when
# FREEMYIP_TOKEN is not set.
#
# Required repository variables:
#   FREEMYIP_DOMAIN    e.g. this.freemyip.com
#   FREEMYIP_CERT_NAME e.g. this-freemyip.dns-freemyip
#
# Required repository secrets:
#   FREEMYIP_TOKEN

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - "src/**"

  # FREEMYIP_TOKEN and CERTBOT_EMAIL are repository secrets on purpose: pull
  # requests need them, which an environment would prevent, and neither can
  # publish anything — the token writes one TXT record, the address registers
  # with Let's Encrypt staging. zizmor's secrets-outside-env is silenced on
  # exactly those lines.
  integration_freemyip:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    name: "DNS-01 via FreeMyIP (staging)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check secrets and variables
        id: check
        env:
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
          FREEMYIP_DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
          FREEMYIP_TOKEN: ${{ secrets.FREEMYIP_TOKEN }} # zizmor: ignore[secrets-outside-env] — see the note on this job
        run: |
          if [ -z "${FREEMYIP_TOKEN}" ]; then
            echo "Skipping: FREEMYIP_TOKEN secret is not configured (fork or external PR)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${FREEMYIP_DOMAIN}" ] || [ -z "${FREEMYIP_CERT_NAME}" ]; then
            echo "ERROR: FREEMYIP_TOKEN is set but domain variables are missing."
            echo "Set these in: Settings → Secrets and variables → Variables"
            echo "  FREEMYIP_DOMAIN     your freemyip subdomain, e.g. mysite.freemyip.com"
            echo "  FREEMYIP_CERT_NAME  lego cert name, e.g. mysite-freemyip.dns-freemyip"
            exit 1
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Debian image (amd64)
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          load: true
          tags: docker-nginx-lego:integration-test

      - name: Create credentials directory
        if: steps.check.outputs.skip != 'true'
        run: mkdir -p /tmp/lego-test-creds

      - name: Write FreeMyIP credentials
        if: steps.check.outputs.skip != 'true'
        env:
          FREEMYIP_TOKEN: ${{ secrets.FREEMYIP_TOKEN }} # zizmor: ignore[secrets-outside-env] — see the note on this job
        run: |
          printf 'FREEMYIP_TOKEN=%s\n' "$FREEMYIP_TOKEN" > /tmp/lego-test-creds/freemyip.ini

      - name: Write FreeMyIP nginx config
        if: steps.check.outputs.skip != 'true'
        env:
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
          FREEMYIP_DOMAIN: ${{ vars.FREEMYIP_DOMAIN }}
        run: |
          mkdir -p /tmp/lego-test-conf
          cat > /tmp/lego-test-conf/freemyip.conf << EOF
          server {
              listen 443 ssl;
              server_name ${FREEMYIP_DOMAIN};
              ssl_certificate     /etc/letsencrypt/live/${FREEMYIP_CERT_NAME}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/${FREEMYIP_CERT_NAME}/privkey.pem;
              location / { return 200 "ok"; add_header Content-Type text/plain; }
          }
          EOF

      - name: Run container and request staging cert
        if: steps.check.outputs.skip != 'true'
        id: run_container
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }} # zizmor: ignore[secrets-outside-env] — see the note on this job
          FREEMYIP_CERT_NAME: ${{ vars.FREEMYIP_CERT_NAME }}
        run: |
          docker run -d \
            --name nginx-lego-test \
            -e CERTBOT_EMAIL="${CERTBOT_EMAIL}" \
            -e STAGING=1 \
            -e RENEWAL_INTERVAL=9999d \
            -e CERTBOT_DNS_CREDENTIALS_DIR=/etc/letsencrypt/credentials \
            -v /tmp/lego-test-creds:/etc/letsencrypt/credentials:ro \
            -v /tmp/lego-test-conf:/etc/nginx/user_conf.d:ro \
            -v lego-test-certs:/etc/letsencrypt \
            -p 8080:80 \
            -p 8443:443 \
            docker-nginx-lego:integration-test
          # Wait up to 90s for cert to appear
          for i in $(seq 1 18); do
            sleep 5
            if docker exec nginx-lego-test test -f /etc/letsencrypt/live/"${FREEMYIP_CERT_NAME}"/fullchain.pem 2>/dev/null; then
              echo "cert_obtained=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Waiting for cert... attempt $i/18"
          done

      - name: Verify certificate file exists
        if: steps.check.outputs.skip != 'true'
        env:
          CERT_OBTAINED: ${{ steps.run_container.outputs.cert_obtained }}
        run: |
          if [ "${CERT_OBTAINED}" != "true" ]; then
            echo "Certificate was not obtained within timeout"
            docker logs nginx-lego-test
            exit 1
          fi
          echo "Certificate obtained successfully"

      - name: Print container logs
        if: steps.check.outputs.skip != 'true' && always()
        run: docker logs nginx-lego-test || true

      - name: Stop and remove container
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          docker stop nginx-lego-test || true
          docker rm nginx-lego-test || true
          docker volume rm lego-test-certs || true

  integration_status:
    name: "Integration test status"
    needs: [integration_freemyip]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          if [ "${INTEGRATION_FREEMYIP_RESULT}" = "failure" ]; then
            exit 1
          fi
        env:
          INTEGRATION_FREEMYIP_RESULT: ${{ needs.integration_freemyip.result }}
