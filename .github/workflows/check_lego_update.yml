name: "check-lego-update"

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check_lego_version:
    name: "Check for new lego release"
    runs-on: ubuntu-latest
    environment: cve-autofix
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get latest lego release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails the run, so no PR is opened, when GitHub gives no usable version.
          LATEST=$(.github/latest_version.sh lego)
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest lego release: ${LATEST}"

      - name: Get pinned lego version from Dockerfile
        id: pinned
        run: |
          PINNED=$(grep -m1 'ARG LEGO_VERSION=' src/Dockerfile | cut -d= -f2)
          echo "version=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "Pinned lego version: ${PINNED}"

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
        run: |
          if [ "$LATEST" = "$PINNED" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "lego is up to date ($PINNED)"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "New lego version available: $LATEST (current: $PINNED)"
          fi

      - name: Update lego and its checksum pins in the Dockerfiles
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          NEW: ${{ steps.latest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Writes LEGO_VERSION and every architecture's checksum, and only after
          # gh has verified that lego's release workflow attested each tarball.
          .github/lego_pins.sh --update "$NEW"
          for f in src/Dockerfile src/Dockerfile-alpine src/Dockerfile-ubuntu; do
            grep -qxF "ARG LEGO_VERSION=${NEW}" "$f"
            if [ "$(grep -cE '^ARG LEGO_SHA256_(AMD64|386|ARM64|ARMV7)=[0-9a-f]{64}$' "$f")" -ne 4 ]; then
              echo "::error::${f} does not pin all four lego checksums"; exit 1
            fi
          done

      - name: Open pull request
        if: steps.compare.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.CVE_AUTOFIX_TOKEN }}
          branch: "bump/lego-${{ steps.latest.outputs.version }}"
          commit-message: "Bump lego from ${{ steps.pinned.outputs.version }} to ${{ steps.latest.outputs.version }}"
          title: "Bump lego from ${{ steps.pinned.outputs.version }} to ${{ steps.latest.outputs.version }}"
          body: |
            Automated lego version bump.

            - **From:** `${{ steps.pinned.outputs.version }}`
            - **To:** `${{ steps.latest.outputs.version }}`
            - **Release notes:** https://github.com/go-acme/lego/releases/tag/v${{ steps.latest.outputs.version }}

            This PR was opened automatically by the `check-lego-update` workflow.
            The build CI will validate the new binary across all platforms.
          labels: "dependencies"
